name: iOS

on:
  push:
    branches: [main]
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:
    inputs:
      testflight:
        description: "Upload this build to TestFlight"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      ARCORE_API_KEY: ${{ secrets.ARCORE_API_KEY }}
      ARCORE_TOKEN_AUTH: ${{ secrets.ARCORE_TOKEN_AUTH }}
      SUPPORT_EMAIL: ${{ secrets.SUPPORT_EMAIL }}
      SITE_URL: ${{ secrets.SITE_URL }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - uses: actions/checkout@v4

      - name: Pick the newest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Tools
        run: brew install xcodegen || brew upgrade xcodegen

      - name: Generate project
        working-directory: ios
        run: |
          ci/write-secrets.sh
          xcodegen generate

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: ios/.spm
          key: spm-${{ hashFiles('ios/project.yml') }}

      - name: Compile
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project GeoTag.xcodeproj -scheme GeoTag -configuration Debug \
            -destination 'generic/platform=iOS' -clonedSourcePackagesDirPath .spm \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build.log | grep -E "error:|warning: .*/GeoTag/|\*\* BUILD" || true
          grep -q "\*\* BUILD SUCCEEDED \*\*" build.log

      - name: Archive and upload to TestFlight
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.testflight }}
        working-directory: ios
        run: |
          set -euo pipefail
          if [ -z "$TEAM_ID" ] || [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_KEY_P8" ]; then
            echo "::error::Add APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID and ASC_KEY_P8 secrets first (README, TestFlight section)."
            exit 1
          fi
          mkdir -p ~/private_keys
          KEY=~/private_keys/AuthKey_${ASC_KEY_ID}.p8
          if echo "$ASC_KEY_P8" | grep -q "BEGIN PRIVATE KEY"; then echo "$ASC_KEY_P8" > "$KEY"; else echo "$ASC_KEY_P8" | base64 --decode > "$KEY"; fi
          AUTH="-allowProvisioningUpdates -authenticationKeyPath $KEY -authenticationKeyID $ASC_KEY_ID -authenticationKeyIssuerID $ASC_ISSUER_ID"
          BUILD_NO=$(( ${{ github.run_number }} + 100 ))
          xcodebuild -project GeoTag.xcodeproj -scheme GeoTag -configuration Release \
            -destination 'generic/platform=iOS' -clonedSourcePackagesDirPath .spm \
            -archivePath build/GeoTag.xcarchive \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic CURRENT_PROJECT_VERSION=$BUILD_NO \
            $AUTH archive 2>&1 | tee archive.log | grep -E "error:|\*\* ARCHIVE" || true
          grep -q "\*\* ARCHIVE SUCCEEDED \*\*" archive.log
          sed "s/TEAM_ID_HERE/$TEAM_ID/" ci/ExportOptions.plist > build/ExportOptions.plist
          xcodebuild -exportArchive -archivePath build/GeoTag.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist -exportPath build/export $AUTH 2>&1 | tee export.log | tail -20
          grep -q "EXPORT SUCCEEDED\|Upload succeeded\|Uploaded" export.log
          echo "Uploaded build $BUILD_NO. It shows up in TestFlight after Apple finishes processing (5 to 30 minutes)."

      - name: Publish build status
        if: always()
        working-directory: ios
        run: |
          {
            echo "run: ${{ github.run_id }}  commit: ${{ github.sha }}  status: ${{ job.status }}"
            echo "xcode: $(xcodebuild -version | head -1)"
            echo "--- errors"
            grep -E "error:" build.log archive.log export.log 2>/dev/null | sort -u | head -80 || true
            echo "--- tail"
            tail -30 build.log 2>/dev/null || true
            tail -30 export.log 2>/dev/null || true
          } > /tmp/status.txt
          cd "$GITHUB_WORKSPACE"
          git config user.name "geo# ci"; git config user.email "ci@users.noreply.github.com"
          git fetch origin ci-status:ci-status 2>/dev/null || true
          git worktree add /tmp/st ci-status 2>/dev/null || { git worktree add --orphan -b ci-status /tmp/st 2>/dev/null || (git worktree add -b ci-status /tmp/st && git -C /tmp/st rm -rf . -q); }
          cp /tmp/status.txt /tmp/st/status.txt
          cd /tmp/st && git add status.txt && git commit -qm "build ${{ github.run_number }}: ${{ job.status }}" && git push -q origin ci-status || true

  # Launches the app in the iOS Simulator and screenshots the first screens. Runs when a commit message has [smoke].
  smoke:
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[smoke]') }}
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: brew install xcodegen || true
      - name: Build for the simulator
        working-directory: ios
        run: |
          ci/write-secrets.sh
          xcodegen generate
          set -o pipefail
          xcodebuild -project GeoTag.xcodeproj -scheme GeoTag -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/sim \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee sim.log | grep -E "error:|\*\* BUILD" || true
          grep -q "\*\* BUILD SUCCEEDED \*\*" sim.log
      - name: Launch and screenshot
        working-directory: ios
        run: |
          set -x
          RT=$(xcrun simctl list runtimes -j | python3 -c "import json,sys; r=[x for x in json.load(sys.stdin)['runtimes'] if x['platform']=='iOS' and x['isAvailable']]; print(r[-1]['identifier'])")
          DT=$(xcrun simctl list devicetypes -j | python3 -c "import json,sys; d=[x for x in json.load(sys.stdin)['devicetypes'] if 'iPhone 1' in x['name'] and 'Pro Max' in x['name']]; print(d[-1]['identifier'])")
          UDID=$(xcrun simctl create shots "$DT" "$RT")
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          APP=$(find build/sim -name "GeoTag.app" -path "*iphonesimulator*" | head -1)
          xcrun simctl install "$UDID" "$APP"
          mkdir -p shots
          shoot() { xcrun simctl terminate "$UDID" com.kafkaesq.geotag || true; xcrun simctl launch "$UDID" com.kafkaesq.geotag "$@"; sleep 8; xcrun simctl io "$UDID" screenshot "shots/$name.png"; }
          name=1-offline shoot -geoScreen offline
          name=2-intro shoot -geoScreen onboarding -geoStep 0
          name=3-rules shoot -geoScreen onboarding -geoStep 1
          name=4-gate shoot -geoScreen onboarding -geoStep 2
          name=5-practice shoot -geoScreen practice
          xcrun simctl spawn "$UDID" log show --last 2m --predicate 'process == "GeoTag"' --style compact 2>/dev/null | grep -iE "fault|crash|fatal|error" | head -40 > shots/log.txt || true
      - name: Publish screenshots
        if: always()
        run: |
          git config user.name "geo# ci"; git config user.email "ci@users.noreply.github.com"
          git fetch origin ci-status:ci-status
          git worktree add /tmp/st ci-status
          mkdir -p /tmp/st/shots && cp ios/shots/* /tmp/st/shots/ 2>/dev/null || true
          grep -E "error:" ios/sim.log 2>/dev/null | sort -u | head -40 > /tmp/st/shots/build-errors.txt || true
          cd /tmp/st && git add -A && git commit -qm "smoke ${{ github.run_number }}" && git push -q origin ci-status || true
